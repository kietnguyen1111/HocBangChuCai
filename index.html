<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Học bảng chữ cái</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&family=Noto+Sans+JP:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--b1:#ffe3ec;--b2:#ffd9b5;--b3:#fff0b3;--cd:#fff6ee;--ink:#2d2436;--mu:#7a6a78;--ac:#f97316;--ln:#ffd9b8;--pl:#ffe5cc;--ok:#16a34a;--no:#dc2626}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--b1:#2a1830;--b2:#3a2236;--b3:#2d2740;--cd:#2b2233;--ink:#f6eaf0;--mu:#b9a6b8;--ln:#4a3a52;--pl:#4a3350}}
:root[data-theme=dark]{--b1:#2a1830;--b2:#3a2236;--b3:#2d2740;--cd:#2b2233;--ink:#f6eaf0;--mu:#b9a6b8;--ln:#4a3a52;--pl:#4a3350}
*{box-sizing:border-box}html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;font:600 16px Nunito,'Noto Sans JP',sans-serif;color:var(--ink);background:linear-gradient(135deg,var(--b1),var(--b2) 55%,var(--b3)) fixed}
button{font:inherit;color:inherit;cursor:pointer}
#sk{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
main{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:14px}
.card{background:var(--cd);border-radius:26px;border:2px solid var(--ln);box-shadow:0 10px 40px #f9731633;overflow:hidden}
header{padding:16px 12px 10px;text-align:center}
h1{margin:0 0 10px;font-size:clamp(20px,5vw,28px);font-weight:800;color:var(--ac)}
.tabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.tb,.ic{border:0;border-radius:99px;padding:8px 14px;background:var(--pl);color:#c2410c;font-weight:800}
.tb.on{background:var(--ac);color:#fff}
section{padding:6px 16px 22px}
h3{margin:16px 0 8px;font-size:15px;color:var(--ac)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;border:1.5px solid var(--ln);background:var(--cd);border-radius:12px;padding:9px 8px;font-weight:800}
.seg button.on,.chip.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ln);background:var(--cd);border-radius:99px;padding:6px 12px;font-size:14px;font-weight:800}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.rw{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:6px}.rw.y{grid-template-columns:repeat(3,1fr)}
.cell{border:1.5px solid var(--ln);background:var(--cd);border-radius:12px;padding:6px 2px;text-align:center}
.cell.ok{background:#bbf7d0;color:#14532d}.cell.bad{background:#fecaca;color:#7f1d1d}
.kc{font:700 22px 'Noto Sans JP',sans-serif;display:block}.cell small{color:inherit;opacity:.75;font-size:12px}
.nt{font-size:14px;line-height:1.6;color:var(--mu)}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px;background:var(--cd);border:1.5px solid var(--ln);border-radius:14px;padding:8px 10px;margin:8px 0 12px;font-size:13px}
.pill{background:var(--pl);color:#c2410c;border-radius:99px;padding:4px 10px;font-weight:800}.mu{color:var(--mu)}
.big{font:700 54px 'Noto Sans JP',Nunito,sans-serif;text-align:center;margin:6px 0;line-height:1.2}.big.sm{font-size:34px}
.qq{text-align:center;font-size:19px;font-weight:800;margin-top:14px}.sub{text-align:center;color:var(--mu);margin-bottom:12px}
.ch{width:100%;text-align:left;padding:14px 16px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);font-weight:800;margin:0 0 10px}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g2 .ch{text-align:center;font:700 28px 'Noto Sans JP',sans-serif;margin:0}
.ch:disabled{color:var(--ink);cursor:default}
.ch.ok{background:#bbf7d0;border-color:var(--ok);color:#14532d}
.ch.no{background:#fecaca;border-color:var(--no);color:#7f1d1d;animation:sk .4s}
@keyframes sk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.fb{border-radius:14px;padding:12px 14px;line-height:1.65;margin-top:12px;background:#fef3c7;color:#78350f}.fb.g{background:#dcfce7;color:#14532d}
.ty{display:flex;gap:8px}.ty input{flex:1;min-width:0;font:700 20px Nunito,sans-serif;padding:12px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);color:var(--ink)}
.okk{border-color:var(--ok)!important}.nok{border-color:var(--no)!important}
.btn{display:block;width:100%;border:0;border-radius:16px;padding:14px;background:var(--ac);color:#fff;font-weight:800;font-size:17px;margin-top:12px}
.ghost{display:block;width:100%;border:2px solid var(--ln);background:var(--cd);border-radius:16px;padding:11px;margin-top:10px;font-weight:800}
.ghost.end{margin-top:40px;padding:8px;font-size:13px;border-style:dashed;color:var(--mu)}
:root{--cdA:#fff6eed2;--od:1;--on:0;--m1:#8fa6c9;--sn:#fff;--m2:#b7d9a8;--m3:#8cc084;--tr:#6b4a3a;--bl:#ffb3c9;--bl2:#ffd6e2;--orb:#fff3b0;--st:0}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--cdA:#2b2233d2;--od:0;--on:1;--m1:#3a4470;--sn:#c9d3ff;--m2:#2b3a4a;--m3:#1f2d36;--tr:#3a2a2e;--bl:#c77a9b;--bl2:#e6a1bd;--orb:#f4f1d0;--st:1}}
:root[data-theme=dark]{--cdA:#2b2233d2;--od:0;--on:1;--m1:#3a4470;--sn:#c9d3ff;--m2:#2b3a4a;--m3:#1f2d36;--tr:#3a2a2e;--bl:#c77a9b;--bl2:#e6a1bd;--orb:#f4f1d0;--st:1}
#bg{position:fixed;inset:0;z-index:0;overflow:hidden}
.sky{position:absolute;inset:0;transition:opacity .9s}
.sky.d{background:linear-gradient(#8ec9f5,#ffe3ec 60%,#fff0d0);opacity:var(--od)}
.sky.n{background:linear-gradient(#0f1030,#2a1d4a 55%,#5a2d5e);opacity:var(--on)}
#sc{position:absolute;inset:0;width:100%;height:100%}
#sc *{transition:fill .9s,stroke .9s,opacity .9s}
.st{opacity:var(--st);animation:tw 3s infinite}.st:nth-child(2n){animation-delay:1s}
@keyframes tw{50%{filter:brightness(.4)}}
.card{background:var(--cdA);backdrop-filter:blur(8px)}
.card,.cell,.chip,.bar,.seg button{transition:background-color .5s,color .5s,border-color .5s}
button{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 4px;text-align:left}
h1{margin:0;font-size:clamp(16px,5vw,26px)}
.ics{display:flex;gap:6px}.ic{padding:6px 10px;font-size:16px}
#nv{position:fixed;left:0;right:0;bottom:0;z-index:5;max-width:640px;margin:0 auto;display:flex;gap:2px;background:var(--cdA);backdrop-filter:blur(10px);border:2px solid var(--ln);border-bottom:0;border-radius:18px 18px 0 0;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
#nv .tb{flex:1;min-width:0;border-radius:14px;background:none;color:var(--mu);font-size:11px;font-weight:800;padding:5px 0;display:flex;flex-direction:column;align-items:center;gap:1px}
#nv .tb i{font-style:normal;font-size:20px}#nv .tb.on{background:var(--pl);color:#c2410c}
main{padding:10px 10px 96px}
.wh{display:flex;align-items:center;justify-content:center;gap:10px;margin:8px 0}
.wsv{display:block;width:min(100%,50vh);aspect-ratio:1;margin:10px auto;background:var(--cd);border:2px solid var(--ln);border-radius:18px;touch-action:none}
.gd{stroke:var(--ln);stroke-dasharray:2 3;stroke-width:.6;fill:none}
.gp,.dn,.up{fill:none;stroke-linecap:round;stroke-linejoin:round}
.gp{stroke:var(--ink);opacity:.18;stroke-width:5}
.dn{stroke:var(--ac);stroke-width:5.2;stroke-dasharray:1;animation:dr .35s}
.up{stroke:#3b82f6;stroke-width:4;opacity:.85}
.nb{fill:var(--ac)}.nt2{font:800 5px Nunito,sans-serif;fill:#fff;text-anchor:middle}
.wsv text,.wsv circle{pointer-events:none}
.wsv.m1 .gp,.wsv.m1 #wnm{opacity:0}
.wsv .gp.hl{opacity:1;stroke:var(--ac);stroke-width:6;animation:bl .6s 3}
.wsv.an .gp{opacity:1;stroke:var(--ac);stroke-dasharray:1;stroke-dashoffset:1;animation:dr .7s forwards}
@keyframes dr{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes bl{50%{stroke-width:9}}
.fcw{perspective:900px;margin:12px 0}
.fcd{position:relative;height:min(44vh,300px);transform-style:preserve-3d;transition:transform .5s;cursor:pointer}.fcd.fl{transform:rotateY(180deg)}
.fcf,.fcb{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;border-radius:22px;border:2px solid var(--ln);background:var(--cd);font:700 40px 'Noto Sans JP',Nunito,sans-serif;padding:12px}
.fcb{transform:rotateY(180deg)}.fs2{display:block;font:600 14px Nunito,sans-serif;color:var(--mu);margin-top:8px}
.g2b{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn.no{background:#ef4444}.btn.yes{background:#16a34a}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px}.mg>div{display:grid;gap:8px;align-content:start}
.mc{min-height:54px;border:2px solid var(--ln);border-radius:14px;background:var(--cd);font:800 20px 'Noto Sans JP',Nunito,sans-serif;padding:8px}
.mc.sel{border-color:var(--ac);background:var(--pl)}.mc.dn2{background:#bbf7d0;color:#14532d;opacity:.55;pointer-events:none}.mc.no{background:#fecaca;color:#7f1d1d;animation:sk .4s}
@media(max-width:480px){section{padding:4px 12px 18px}.card{border-radius:20px}.big{font-size:46px}.rw{gap:4px}.kc{font-size:19px}.ch{min-height:54px;padding:14px}.g2 .ch{min-height:64px}}
</style></head><body>
